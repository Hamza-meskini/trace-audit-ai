# Databricks Apps deployment manifest
# Ref: https://docs.databricks.com/en/dev-tools/databricks-apps/app-yaml.html

command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app.main:app"
  - "--app-dir"
  - "backend"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "${DATABRICKS_APP_PORT}"

env:
  - name: "FRONTEND_DIR"
    value: "dist/client"
  - name: "PYTHONUNBUFFERED"
    value: "1"
