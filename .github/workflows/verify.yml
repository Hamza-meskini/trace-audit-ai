name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun audit

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_BACKEND: sqlite
      DEBUG: "false"
      SEED_DEMO_DATA: "false"
      DATABRICKS_MLFLOW_TRACING_ENABLED: "false"
      # The replay gate runs in its own non-blocking job for its first week.
      TRACEAUDIT_REPLAY_IN_SEPARATE_JOB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # requirements.lock is generated from the tested 3.13 environment.
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -c requirements.lock pytest==9.1.1
      - run: python -m pip check
      - run: python -m pytest -q

  # ARC-07: the team develops on Windows (CRLF checkouts, cp1252 consoles).
  # Non-blocking until it has passed for a week, then drop continue-on-error.
  backend-windows:
    runs-on: windows-latest
    continue-on-error: true
    env:
      DATABASE_BACKEND: sqlite
      DEBUG: "false"
      SEED_DEMO_DATA: "false"
      DATABRICKS_MLFLOW_TRACING_ENABLED: "false"
      TRACEAUDIT_REPLAY_IN_SEPARATE_JOB: "1"
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  # EVA-01: replay the five saved Nova runs (committed under
  # evaluation/fixtures/replay) against the expectations ledger. Every PR shows
  # its effect on verdicts and the unsafe count. Non-blocking for the first
  # week; remove continue-on-error once the gate has proven stable.
  replay:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DATABASE_BACKEND: sqlite
      DEBUG: "false"
      SEED_DEMO_DATA: "false"
      DATABRICKS_MLFLOW_TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B evaluation/replay_verification.py --quiet --label ci --out replay-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-ci
          path: replay-ci.json
